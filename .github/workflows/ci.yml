name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cfn-lint PyYAML PyJWT cryptography

      - name: Byte-compile all sources
        run: python -m compileall -q src infra scripts tests run.py

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Self-check
        run: python scripts/selfcheck.py

      - name: Frontend syntax
        run: node --check frontend/app.js

      - name: Validate SAM template
        run: cfn-lint -i W1030 -- infra/template.yaml
