name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cfn-lint PyYAML PyJWT cryptography ruff coverage

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Byte-compile all sources
        run: python -m compileall -q src infra scripts tests run.py

      - name: Unit tests + coverage
        run: |
          python -m coverage run --source=src/breathebuddy,infra -m unittest discover -s tests -t .
          python -m coverage report -m

      - name: Self-check
        run: python scripts/selfcheck.py

      - name: Frontend syntax
        run: |
          node --check frontend/app.js
          node --check frontend/amplify-config.js

      - name: Validate SAM template
        run: cfn-lint -i W1030 -- infra/template.yaml
